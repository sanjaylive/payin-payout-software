# Builds the production image on GitHub (never on the server) and pushes it to GHCR as
#   ghcr.io/<owner>/<repo>:<12-char commit>  and  :latest
# scripts/deploy.sh waits for this run, then has the server pull the finished image.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Public origin baked into the browser bundle. Override with the repository variable PUBLIC_URL.
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://py.2all.co.in' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint and unit tests
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: pnpm typecheck && pnpm lint && pnpm test

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PUBLIC_URL=${{ env.PUBLIC_URL }}
            APP_RELEASE=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
