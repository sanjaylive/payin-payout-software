# pay2all — vhost for __DOMAIN__. Installed by `npm run deploy` (DEPLOY_PROXY=nginx, docs/DEPLOYMENT.md §7).
# Do not edit on the server: the next deploy overwrites it. The certificate comes from
# `certbot certonly --webroot`, so certbot never rewrites this file; renewals reload nginx.
#
# One origin: /v1/ → the NestJS API, everything else → the Next.js app. Both upstreams bind to
# loopback only. Health endpoints are not exposed publicly.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 syntax (Ubuntu 24.04); on 1.25.1+ this still works, with a deprecation notice.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # KYC documents and statement imports are capped at 10 MB by the API; leave room for multipart.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    location ^~ /health/ {
        return 404;
    }

    # Live notifications (server-sent events): unbuffered, allowed to stay open.
    location = /v1/inbox/stream {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
