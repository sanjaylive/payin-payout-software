# Production stack for one server (docs/DEPLOYMENT.md). Started by scripts/deploy.sh:
#   docker compose -f infra/deploy/compose.yml --env-file <deploy dir>/.env.production ...
# Only Caddy publishes ports (80/443; profile "caddy"). On a server whose nginx already owns 80/443,
# compose.nginx.yml publishes the API and web on loopback instead. Everything else is private.
# mem_limit caps every service so a shared server's other workloads keep their memory.
name: pay2all

x-app: &app
  image: pay2all-app:${APP_RELEASE:-latest}
  env_file: ${ENV_FILE:?ENV_FILE is required}
  restart: unless-stopped
  networks: [internal]
  mem_limit: 768m
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
  mem_limit: 700m
  networks: [internal]
  logging: *logging
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_PARTITIONS: 12
    KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:29092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 20s

services:
  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    mem_limit: 256m
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]
    networks: [internal]
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: pay2all
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: pay2all
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay2all -d pay2all"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    logging: *logging

  # Three KRaft brokers: the worker requires replication factor 3 in production. On one server this
  # protects against a broker crash, not against losing the server (docs/DEPLOYMENT.md §6).
  kafka-1:
    <<: *kafka
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092 }
    volumes: [kafka-1:/var/lib/kafka/data]
  kafka-2:
    <<: *kafka
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092 }
    volumes: [kafka-2:/var/lib/kafka/data]
  kafka-3:
    <<: *kafka
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092 }
    volumes: [kafka-3:/var/lib/kafka/data]

  # One-shot: migrations, then the production bootstrap (roles, platform org, first super admin).
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "pnpm --filter @pay2all/database exec prisma migrate deploy && pnpm --filter @pay2all/database db:bootstrap"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [migrate]

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    volumes: [storage:/data/storage]
    # Other stacks (ahost, hostelerp) join this network for the shared Caddy, and Compose registers
    # their services there under their own names too (their "api"/"web" included). Everything that
    # must reach *this* API or web uses the unique aliases pay2all-api / pay2all-web, never api/web.
    networks:
      internal: { aliases: [pay2all-api] }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  jobs:
    <<: *app
    command: ["node", "apps/api/dist/jobs.main.js"]
    mem_limit: 512m
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3000"]
    mem_limit: 512m
    networks:
      internal: { aliases: [pay2all-web] }
    depends_on: [api]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  kafka-1:
  kafka-2:
  kafka-3:
  storage:

networks:
  internal:
