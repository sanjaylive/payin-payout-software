# Overlay for servers where an existing nginx owns 80/443 (DEPLOY_PROXY=nginx, docs/DEPLOYMENT.md §7):
# the API and web publish on loopback only; nginx proxies to them. Caddy is not started.
services:
  api:
    ports: ["127.0.0.1:${API_HOST_PORT:-4500}:4000"]
  web:
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3500}:3000"]
