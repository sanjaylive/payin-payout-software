# Local development infrastructure for Pay2All Payments.
# Host ports are overridable via env and default to non-standard values so they
# do not collide with other local Postgres/Redis/Kafka instances.
name: pay2all

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pay2all
      POSTGRES_PASSWORD: pay2all_dev_only
      POSTGRES_DB: pay2all
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay2all -d pay2all"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-59092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # S3-compatible object storage for local development (KYC documents, reports, recon files).
  # (MinIO no longer publishes public images; any S3-compatible store works — code uses the S3 API only.)
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-58333}:8333"
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-58025}:8025"

  # ---- Optional observability stack: `docker compose --profile observability up -d` ----------
  # Prometheus scrapes the API (9464), jobs (9465) and worker (9466) metrics ports on the host and
  # evaluates infra/prometheus/alerts.yml. Jaeger receives OTLP traces when the apps run with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:54318.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-59090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-56686}:16686"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-54318}:4318"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  s3-data:
