# Local Prometheus for Pay2All (docker compose --profile observability). In production, scrape the
# same three internal ports per pod (METRICS_HOST=0.0.0.0) via service discovery instead.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pay2all-api
    static_configs: [{ targets: ["host.docker.internal:9464"], labels: { process: api } }]
  - job_name: pay2all-jobs
    static_configs: [{ targets: ["host.docker.internal:9465"], labels: { process: jobs } }]
  - job_name: pay2all-worker
    static_configs: [{ targets: ["host.docker.internal:9466"], labels: { process: worker } }]
