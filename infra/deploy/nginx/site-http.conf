# pay2all — temporary vhost for __DOMAIN__ while the first certificate is issued.
# Installed by `npm run deploy` (DEPLOY_PROXY=nginx); replaced by site.conf once the cert exists.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
